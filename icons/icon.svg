<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0052d4" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a1c4fd" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Circle -->
  <circle cx="64" cy="64" r="60" fill="#0b0f19" stroke="#1e293b" stroke-width="3" />

  <!-- Outer Cyber Tech Ring -->
  <circle cx="64" cy="64" r="53" fill="none" stroke="#00f2fe" stroke-dasharray="6 4" stroke-width="1.5" opacity="0.6" />

  <!-- Shield Base -->
  <path d="M 64 22 
           C 85 22, 98 28, 98 46 
           C 98 75, 64 102, 64 102 
           C 64 102, 30 75, 30 46 
           C 30 28, 43 22, 64 22 Z" 
        fill="url(#shieldGrad)" 
        stroke="#38bdf8" 
        stroke-width="2.5" 
        filter="url(#neonGlow)" />

  <!-- Inner Radar / AI Core Grid -->
  <path d="M 64 34 L 64 90 M 42 54 L 86 54 M 46 72 L 82 72" 
        stroke="#ffffff" 
        stroke-width="1.2" 
        opacity="0.35" />

  <!-- Center Eye / Diamond AI Node -->
  <polygon points="64,44 76,58 64,72 52,58" fill="url(#coreGrad)" />
  <circle cx="64" cy="58" r="3.5" fill="#0052d4" />

  <!-- Checkmark / Pulse Wing -->
  <path d="M 48 57 L 59 68 L 80 47" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
