<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Security - Apple ID Authentication</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fbfbfd;
      color: #1d1d1f;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .demo-disclaimer {
      background: #eff6ff;
      border: 1px solid #3b82f6;
      color: #1e40af;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 24px;
      max-width: 480px;
      text-align: center;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 18px;
      padding: 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    .apple-logo {
      font-size: 42px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      color: #86868b;
      font-size: 14px;
      margin-bottom: 28px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="demo-disclaimer">
    ⚠️ <strong>CONTROLLED TEST SCENARIO:</strong> Tests Veridex AI's detection of Internationalized Domain Names (IDN) / Punycode Homoglyph attacks (e.g. Cyrillic 'а', 'е', 'о' mimicking Latin characters) and Apple brand title spoofing.
  </div>

  <div class="auth-card">
    <div class="apple-logo"></div>
    <h1>Sign In with Apple ID</h1>
    <p>Manage your account, devices, and subscriptions securely.</p>

    <form onsubmit="event.preventDefault(); alert('Demo page only - no credentials sent.');">
      <input type="text" placeholder="Apple ID" autocomplete="off">
      <input type="password" placeholder="Password" autocomplete="off">
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
